name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Dogfood: this repo must stay agent-ready.
      - run: node dist/bin.js . --min-score 90
      - run: node dist/bin.js . --sarif > "$RUNNER_TEMP/agent-ready.sarif"
      - run: node -e 'const l=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (l.version !== "2.1.0") process.exit(1)' "$RUNNER_TEMP/agent-ready.sarif"
